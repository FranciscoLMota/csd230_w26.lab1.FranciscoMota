<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Ticket Details</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100">
    <header th:replace="~{fragments/header :: catalogHeader}"></header>
    <main class="mx-auto max-w-3xl p-6 py-12">
      <div class="mb-8 flex justify-between">
        <h1 class="text-3xl font-bold">Ticket Details</h1>
        <a
          th:href="@{/tickets}"
          class="border border-zinc-700 px-3 py-1.5 text-sm"
        >
          &lt; Back
        </a>
      </div>
      <div
        th:if="${ticket}"
        class="divide-y divide-zinc-800 border border-zinc-800 bg-zinc-900"
      >
        <div class="grid grid-cols-3 p-4">
          <b>ID</b>
          <span class="col-span-2" th:text="${ticket.id}"></span>
        </div>
        <div class="grid grid-cols-3 p-4">
          <b>Description</b>
          <span class="col-span-2" th:text="${ticket.description}"></span>
        </div>
        <div class="grid grid-cols-3 p-4">
          <b>Price</b>
          <span class="col-span-2" th:text="${ticket.price}"></span>
        </div>
      </div>
      <p th:unless="${ticket}" class="border border-zinc-800 p-6 text-zinc-400">
        No ticket found.
      </p>
    </main>
  </body>
</html>
