<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Edit Ticket</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100">
    <header th:replace="~{fragments/header :: catalogHeader}"></header>
    <main class="mx-auto max-w-3xl p-6 py-12">
      <div class="mb-8 flex justify-between">
        <h1 class="text-3xl font-bold">Edit Ticket</h1>
        <a
          th:href="@{/tickets}"
          class="border border-zinc-700 px-3 py-1.5 text-sm"
        >
          &lt; Back
        </a>
      </div>
      <form
        th:action="@{/tickets/edit/{id}(id=${ticket.id})}"
        th:object="${ticket}"
        method="post"
        class="space-y-5 border border-zinc-800 bg-zinc-900 p-6"
      >
        <label class="block">
          Description
          <textarea
            th:field="*{description}"
            required
            class="mt-2 w-full border border-zinc-700 bg-zinc-950 p-2"
          ></textarea>
        </label>
        <label class="block">
          Price
          <input
            type="number"
            step="0.01"
            min="0"
            th:field="*{price}"
            required
            class="mt-2 w-full border border-zinc-700 bg-zinc-950 p-2"
          />
        </label>
        <button class="bg-indigo-600 px-4 py-2 font-semibold">
          Update Ticket
        </button>
      </form>
    </main>
  </body>
</html>
