<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-zinc-950 text-zinc-100">

<main class="flex min-h-screen items-center justify-center px-6">

    <div class="w-full max-w-md">

        <div class="mb-8">
            <h1 class="text-3xl font-bold tracking-tight">
                Please Sign In
            </h1>
            <p class="mt-1 text-sm text-zinc-400">
                Enter your credentials to continue.
            </p>
        </div>

        <div th:if="${param.error}"
             class="mb-5 border border-red-500/40 bg-red-500/10 px-4 py-3 text-sm text-red-400">
            Invalid username or password.
        </div>

        <div th:if="${param.logout}"
             class="mb-5 border border-green-500/40 bg-green-500/10 px-4 py-3 text-sm text-green-400">
            You have been logged out.
        </div>

        <form th:action="@{/login}"
              method="post"
              class="border border-zinc-800 bg-zinc-900 p-6">

            <div class="mb-5">
                <label class="mb-2 block text-sm font-medium text-zinc-300">
                    Username
                </label>

                <input type="text"
                       name="username"
                       autofocus="autofocus"
                       required
                       class="w-full border border-zinc-700 bg-zinc-950 px-3 py-2
                              text-zinc-100 outline-none transition
                              focus:border-indigo-500" />
            </div>

            <div class="mb-6">
                <label class="mb-2 block text-sm font-medium text-zinc-300">
                    Password
                </label>

                <input type="password"
                       name="password"
                       required
                       class="w-full border border-zinc-700 bg-zinc-950 px-3 py-2
                              text-zinc-100 outline-none transition
                              focus:border-indigo-500" />
            </div>

            <button type="submit"
                    class="w-full bg-indigo-600 px-4 py-2 text-sm font-semibold
                           text-white transition hover:bg-indigo-500">
                Sign In
            </button>

        </form>

    </div>

</main>

</body>
</html>
