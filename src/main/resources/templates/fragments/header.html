<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header th:fragment="catalogHeader"
        class="mb-8 grid grid-cols-3 items-center border-b border-zinc-800 p-5">
    <a th:href="@{/}"
       class="justify-self-start font-semibold text-zinc-200 transition hover:text-indigo-400">
        The Catalog
    </a>

    <div class="justify-self-center text-sm text-zinc-400">
        Logged in as
        <span sec:authentication="name"
              class="font-medium text-zinc-200">
            User
        </span>
    </div>

    <form th:action="@{/logout}"
          method="post"
          class="justify-self-end">
        <button type="submit"
                class="border border-zinc-700 px-3 py-1.5 text-sm text-zinc-300
                       transition hover:border-red-500/50 hover:bg-red-500/10
                       hover:text-red-400">
            Sign Out
        </button>
    </form>
</header>

</body>
</html>
