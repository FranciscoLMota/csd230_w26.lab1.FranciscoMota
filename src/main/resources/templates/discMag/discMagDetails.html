<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Disc Magazine Details</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100">
    <header th:replace="~{fragments/header :: catalogHeader}"></header>
    <main class="mx-auto max-w-3xl p-6 py-12">
      <div class="mb-8 flex justify-between">
        <h1 class="text-3xl font-bold">Disc Magazine Details</h1>
        <a
          th:href="@{/disc-mags}"
          class="border border-zinc-700 px-3 py-1.5 text-sm"
        >
          &lt; Back
        </a>
      </div>
      <div
        th:if="${discMag}"
        class="divide-y divide-zinc-800 border border-zinc-800 bg-zinc-900"
      >
        <div class="grid grid-cols-3 p-4">
          <b>ID</b>
          <span class="col-span-2" th:text="${discMag.id}"></span>
        </div>
        <div class="grid grid-cols-3 p-4">
          <b>Title</b>
          <span class="col-span-2" th:text="${discMag.title}"></span>
        </div>
        <div class="grid grid-cols-3 p-4">
          <b>Price</b>
          <span class="col-span-2" th:text="${discMag.price}"></span>
        </div>
        <div class="grid grid-cols-3 p-4">
          <b>Copies</b>
          <span class="col-span-2" th:text="${discMag.copies}"></span>
        </div>
        <div class="grid grid-cols-3 p-4">
          <b>Order Quantity</b>
          <span class="col-span-2" th:text="${discMag.orderQty}"></span>
        </div>
        <div class="grid grid-cols-3 p-4">
          <b>Current Issue</b>
          <span
            class="col-span-2"
            th:text="${#temporals.format(discMag.currentIssue, 'yyyy-MM-dd HH:mm')}"
          ></span>
        </div>
        <div class="grid grid-cols-3 p-4">
          <b>Has Disc</b>
          <span
            class="col-span-2"
            th:text="${discMag.hasDisc ? 'Yes' : 'No'}"
          ></span>
        </div>
      </div>
      <p
        th:unless="${discMag}"
        class="border border-zinc-800 p-6 text-zinc-400"
      >
        No disc magazine found.
      </p>
    </main>
  </body>
</html>
