<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Add Book</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-zinc-950 text-zinc-100">

<header th:replace="~{fragments/header :: catalogHeader}"></header>

<main class="mx-auto max-w-6xl p-6 py-3">

    <div class="mb-8 flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold tracking-tight">
                Add New Book
            </h1>
            <p class="mt-1 text-sm text-zinc-400">
                Enter the information for the new book.
            </p>
        </div>

        <a th:href="@{/books}"
           class="border border-zinc-700 px-3 py-1.5 text-sm text-zinc-300 transition
                 hover:border-zinc-500 hover:bg-zinc-800 hover:text-white">
            < Back
        </a>
    </div>


    <form action="#"
          th:action="@{/books/add}"
          th:object="${book}"
          method="post"
          class="border border-zinc-800 bg-zinc-900 p-6">

        <div class="mb-5">
            <label class="mb-2 block text-sm font-medium text-zinc-300">
                Title
            </label>

            <input type="text"
                   th:field="*{title}"
                   required
                   class="w-full border border-zinc-700 bg-zinc-950 px-3 py-2
                          text-zinc-100 outline-none transition
                          focus:border-indigo-500" />
        </div>

        <div class="mb-5">
            <label class="mb-2 block text-sm font-medium text-zinc-300">
                Author
            </label>

            <input type="text"
                   th:field="*{author}"
                   required
                   class="w-full border border-zinc-700 bg-zinc-950 px-3 py-2
                          text-zinc-100 outline-none transition
                          focus:border-indigo-500" />
        </div>

        <div class="mb-5">
            <label class="mb-2 block text-sm font-medium text-zinc-300">
                Price
            </label>

            <input type="number"
                   step="0.01"
                   th:field="*{price}"
                   required
                   class="w-full border border-zinc-700 bg-zinc-950 px-3 py-2
                          text-zinc-100 outline-none transition
                          focus:border-indigo-500" />
        </div>

        <div class="mb-6">
            <label class="mb-2 block text-sm font-medium text-zinc-300">
                Copies
            </label>

            <input type="number"
                   th:field="*{copies}"
                   required
                   class="w-full border border-zinc-700 bg-zinc-950 px-3 py-2
                          text-zinc-100 outline-none transition
                          focus:border-indigo-500" />
        </div>

        <div class="mb-5">
            <label class="mb-2 block text-sm font-medium text-zinc-300">
                ISBN
            </label>

            <input type="text"
                   th:field="*{isbn}"
                   required
                   class="w-full border border-zinc-700 bg-zinc-950 px-3 py-2
                          text-zinc-100 outline-none transition
                          focus:border-indigo-500" />
        </div>

        <div class="flex items-center gap-3">

            <button type="submit"
                    class="bg-indigo-600 px-4 py-2 text-sm font-semibold text-white
                           transition hover:bg-indigo-500">
                Add Book
            </button>

        </div>

    </form>

</main>

</body>
</html>
