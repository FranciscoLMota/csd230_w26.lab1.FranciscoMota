<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book List</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-zinc-950 text-zinc-100">

<main class="mx-auto max-w-6xl px-6 py-12">
    <div class="mb-8 flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold tracking-tight">
                Books
            </h1>
            <p class="mt-1 text-sm text-zinc-400">
                Manage your book collection.
            </p>
        </div>

        <a th:href="@{/cart}"
           class="bg-indigo-500 px-4 py-2 text-sm font-semibold text-zinc-950
                  transition hover:bg-indigo-400">
            Cart
        </a>

        <a th:href="@{/books/add}"
           class="bg-indigo-500 px-4 py-2 text-sm font-semibold text-zinc-950
                  transition hover:bg-indigo-400">
            + Add New Book
        </a>
    </div>

    <div class="overflow-hidden border border-zinc-800 bg-zinc-900">

        <table class="w-full text-left">

            <thead class="border-b border-zinc-800 bg-zinc-900/80">
            <tr class="text-sm text-zinc-400">
                <th class="px-6 py-4 font-medium">Title</th>
                <th class="px-6 py-4 font-medium">Author</th>
                <th class="px-6 py-4 font-medium">Price</th>
                <th class="px-6 py-4 font-medium">Copies</th>
                <th class="px-6 py-4 text-right font-medium">Actions</th>
            </tr>
            </thead>

            <tbody class="divide-y divide-zinc-800">

            <tr th:each="book : ${books}"
                class="transition hover:bg-zinc-800/50">

                <td class="px-6 py-4 font-medium text-zinc-100"
                    th:text="${book.title}">
                </td>

                <td class="px-6 py-4 text-zinc-300"
                    th:text="${book.author}">
                </td>

                <td class="px-6 py-4 text-zinc-300"
                    th:text="${book.price}">
                </td>

                <td class="px-6 py-4 text-zinc-300"
                    th:text="${book.copies}">
                </td>

                <td class="px-6 py-4">
                    <div class="flex justify-end gap-2">

                        <a th:href="@{/books/{id}(id=${book.id})}"
                           class=" border border-zinc-700 px-3 py-1.5
                                  text-sm text-zinc-300 transition
                                  hover:border-zinc-500 hover:bg-zinc-800 hover:text-white">
                            Details
                        </a>

                        <a th:href="@{/books/edit/{id}(id=${book.id})}"
                           class="border border-indigo-500/50 px-3 py-1.5
                                  text-sm text-indigo-400 transition
                                  hover:bg-indigo-500/10">
                            Edit
                        </a>

                        <a th:href="@{/books/delete/{id}(id=${book.id})}"
                           class="border border-red-500/40 px-3 py-1.5
                                  text-sm text-red-400 transition
                                  hover:bg-red-500/10">
                            Delete
                        </a>

                        <a th:href="@{/cart/add/{id}(id=${book.id})}"
                           class="border border-green-500/40 px-3 py-1.5
                                  text-sm text-green-400 transition
                                  hover:bg-green-500/10">
                            Add to Cart
                        </a>


                    </div>
                </td>

            </tr>

            </tbody>
        </table>

    </div>

</main>

</body>
</html>
